version: '3.8'

services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: barrierguard-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-barrierguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI REST API Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: barrierguard-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/barrierguard
      - SECRET_KEY=barrierguard-sih-oil-super-secret-key-2025
      - LLM_PROVIDER=${LLM_PROVIDER:-MOCK}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React Vite Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: barrierguard-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
